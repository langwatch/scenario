[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langwatch-scenario"
version = "1.7.1"
description = "The end-to-end agent testing library"
readme = "README.md"
authors = [{ name = "LangWatch Team", email = "support@langwatch.ai" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pytest>=9.0.3",
    "pytest-rerunfailures>=14.0",
    # litellm 1.106 imports the optional `mcp` package whenever a completion
    # passes tools, so JudgeAgent fails with "No module named 'mcp'" on a
    # fresh install. Lift the cap once litellm stops doing that.
    "litellm>=1.83.14,<1.111",
    "openai>=1.88.0",
    "python-dotenv>=1.0.1",
    "termcolor>=2.4.0",
    "pydantic>=2.7.0",
    "joblib>=1.4.2",
    "wrapt>=1.17.2,<3",
    "pytest-asyncio>=0.26.0",
    "rich>=13.3.3,<16.0.0",
    "pksuid>=1.1.2",
    "httpx>=0.27.0",
    "rx>=3.2.0",
    "python-dateutil>=2.9.0.post0",
    "pydantic-settings>=2.14.2",
    # Floor 1.0: the first langwatch that imports pandas-free. Older versions
    # pull pandas in at module load through langwatch.evaluations, which
    # breaks installs without the [report] extra.
    "langwatch>=1.0.0,<3",
    "opentelemetry-sdk>=1.20.0",
    # Voice agent support (issue #350). Hard deps: voice is first-class.
    # imageio-ffmpeg bundles the ffmpeg binary (not ffplay) for audio
    # conversion and playback-via-subprocess.
    "imageio-ffmpeg>=0.5.0",
    "numpy>=1.26",
    "webrtcvad-wheels>=2.0",
    "websockets>=12",
    # Twilio transport (TwilioAgentAdapter): REST client + webhook server.
    "twilio>=9.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # µ-law codec: stdlib `audioop` was removed in Python 3.13; the LTS fork
    # is a drop-in replacement on 3.13+.
    "audioop-lts>=0.2.1; python_version>='3.13'",
    # Gemini Live transport (GeminiLiveAgentAdapter): official async SDK.
    "google-genai>=1.0",
    # ElevenLabs TTS provider (elevenlabs/<voice> routing). STT + hosted
    # Conversational AI adapters use raw httpx; TTS uses the SDK because
    # its streaming-bytes API cleanly handles chunked PCM without us
    # reimplementing the framing.
    "elevenlabs>=1.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "pytest-cov",
    "pre-commit",
    "pyright",
    "pydantic-ai-slim[openai]>=1.102.0,<2.0.0",
    "function-schema",
    "pdoc3",
    "respx",
    "aiohttp",
]
# Install with `pip install 'langwatch-scenario[report]'` to use
# `scenario redteam-report`.
report = [
    "streamlit>=1.30",
    "plotly>=5.0",
    "pandas>=2.0",
]

[project.scripts]
scenario = "scenario.cli:main"

# Named after the module so a project that already opts in with
# `pytest_plugins = ["scenario.pytest_plugin"]` keeps working.
[project.entry-points.pytest11]
"scenario.pytest_plugin" = "scenario.pytest_plugin"

[project.urls]
"Homepage" = "https://github.com/langwatch/scenario"
"Bug Tracker" = "https://github.com/langwatch/scenario/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scenario*"]

[tool.setuptools.package-data]
"scenario" = ["_generated/**/*", "voice/assets/noise/*.wav", "voice/assets/noise/LICENSES.md"]

[tool.pytest.ini_options]
markers = ["agent_test: marks tests as agent scenario tests"]
# Per-test timeout deliberately NOT set in ini_options — pytest-timeout's
# signal and thread methods both failed to isolate hangs in asyncio tests
# (first hang killed the whole process). @e2e voice tests that hit LLMs
# can legitimately take 5+ min; unit tests finish fast. Developers hitting
# a hung test can add @pytest.mark.timeout(N) inline on that test.

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.8.0",  # security: urllib3 advisories covering <2.8.0
    "python-liquid>=2.2.1",
    "filelock>=4.2.1",  # security: filelock advisories covering <=4.2.0
    "virtualenv>=21.14.13",  # security: virtualenv advisories covering <21.14.13
    "fsspec>=2026.6.0",  # security: fsspec advisory covering <2026.6.0
    "mako>=1.4.2",  # security: Mako advisory covering <=1.4.1
    "multidict>=6.9.1",  # security: multidict advisory covering 6.7.0-6.9.0
    "pydantic-ai-slim>=1.107.7",  # security: pydantic-ai advisories fixed on the 1.x line up to 1.107.7
    "pillow>=13.0.0",  # security: Pillow advisories covering <13.0.0
    "gitpython>=3.2.1",  # security: GitPython advisories covering <=3.2.0
    "pyasn1>=0.6.5",  # security: pyasn1 advisories (#534, #535) and four HIGH quadratic decoding ones fixed in 0.6.5
    "aiohttp>=3.14.4",  # security: aiohttp advisories (#594-#596, and three covering <=3.14.3)
    "cryptography>=50.0.0",  # security: cryptography advisory (#597)
    "anyio>=4.14.2",  # security: anyio advisories (#745, #746)
    "httpx2>=2.12.0",  # security: httpx2 advisories (#708-#710)
    "httpcore2>=2.10.0",  # security: httpcore2 advisory (#707)
    "pyjwt>=2.15.0",  # security: PyJWT advisories covering <=2.14.0
    "litellm>=1.100.4",  # security: litellm advisories covering <1.95.0 and 1.91.0-1.100.3, two HIGH
    "certifi>=2026.10.19",  # security: certifi advisory covering <2026.10.19
    "black>=26.10.1",  # security: black advisory covering <26.10.1
    "opentelemetry-api>=1.45.2",  # security: opentelemetry-api advisories covering <=1.45.1
]


[dependency-groups]
dev = [
    "function-schema>=0.4.5",
    "pre-commit>=4.2.0",
    "pydantic-ai-slim[openai]>=1.102.0,<2.0.0",
    "pyright>=1.1.405",
    "pytest-asyncio-concurrent>=0.4.1",
    "pdoc3>=0.11.6",
    "respx>=0.22.0",
    "aiohttp>=3.9",
    # Guard the suite against individual hangs — any test taking longer
    # than `timeout` in pytest.ini_options below fails fast instead of
    # pinning the CI runner. Set per-test; global suite has no limit.
    "pytest-timeout>=2.3",
    # Voice agents feature contract in specs/voice-agents.feature: pytest-bdd
    # binds each Scenario to a Python test function so the 83-scenario contract
    # is verifiable (issue #350). Minimal bindings live under tests/voice/bdd/;
    # scale-up tracked as follow-up.
    "pytest-bdd>=8.1.0",
]
