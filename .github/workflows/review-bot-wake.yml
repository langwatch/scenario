name: review-bot-wake

# Wakes the Laze PR review bot once the other checks on a pull request's head
# commit have finished green. The bot's Laze watch turns a PR comment that
# mentions @langwatch-pr-review-bot into a review, so the job's own token is
# enough and no secret is needed. The same wake runs in langwatch/langwatch.
#
# Deliberately non-blocking: a red or slow CI, a GitHub API error or a failed
# comment all end with this job green, so it never fails anyone's PR because
# of Laze. Keep it out of branch protection.

on:
  pull_request:
    # ready_for_review is not a default activity type: without it, taking a
    # pull request out of draft would wake nothing.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: read # to list the check runs of the head commit while waiting
  contents: read # to read the commit statuses of the head commit
  pull-requests: write # to post the wake comment

# A new push cancels the old wait, so only the latest head commit is reviewed.
concurrency:
  group: review-bot-wake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-bot-wake:
    # The wait step below skips its own check run by this name.
    name: review-bot-wake
    # Drafts and dependency bots get no review. Fork PRs get a read-only
    # token that cannot comment, so they are skipped rather than failed.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Above the wait's own 45-minute deadline and the comment's 2 minutes.
    timeout-minutes: 60
    steps:
      # Polls the head commit's check runs and commit statuses every 30s until
      # none is queued or in progress, and sets green=true only when none
      # failed, was cancelled or timed out. A red check or the 45-minute
      # deadline ends the wait with a notice and no comment.
      - name: Wait for the other checks on the head commit
        id: wait
        continue-on-error: true
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # This job's own check run would wait on itself.
          EXCLUDE_CHECK: review-bot-wake
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            # The first sleep also gives checks started by the same push time to register.
            sleep 30
            # Reads every check run and status of the head commit, keeps the newest
            # run of each check (a re-run supersedes the old one), leaves this job's
            # own out, and lists the names that failed and the names still running.
            # Any error here (API, parsing) counts as an unread round, never as green.
            if runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
                 --jq '.check_runs[] | {kind: "run", id, name, done: (.status == "completed"), bad: (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")}') &&
               statuses=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status?per_page=100" \
                 --jq '.statuses[] | {kind: "status", name: .context, done: (.state != "pending"), bad: (.state == "failure" or .state == "error")}') &&
               checks=$(printf '%s\n%s\n' "$runs" "$statuses" | jq -c -s --arg skip "$EXCLUDE_CHECK" \
                 '(map(select(.kind == "run")) | group_by(.name) | map(max_by(.id))) + map(select(.kind == "status")) | .[] | select(.name != $skip)') &&
               failed=$(jq -r 'select(.bad) | .name' <<<"$checks") &&
               pending=$(jq -r 'select(.done | not) | .name' <<<"$checks"); then
              if [ -n "$failed" ]; then
                echo "::notice::Not waking the review bot: these checks did not pass: $(tr '\n' ' ' <<<"$failed")"
                exit 0
              fi
              if [ -z "$pending" ]; then
                echo "All checks on ${HEAD_SHA:0:7} finished green."
                echo "green=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Waiting for: $(tr '\n' ' ' <<<"$pending")"
            else
              echo "Could not read the checks this round; trying again."
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::notice::Not waking the review bot: checks not all finished (or not readable) after 45 minutes."
              exit 0
            fi
          done

      # Wakes the bot with a PR comment that mentions it. A failed comment
      # leaves this job green.
      - name: Wake the Laze review bot
        if: steps.wait.outputs.green == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@langwatch-pr-review-bot review at ${HEAD_SHA:0:7}"
