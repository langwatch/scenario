name: Publish Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # GitHub Pages config for vocs.config.ts
  BASE_URL: "https://scenario-docs.langwatch.ai"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: python
      - name: Generate python docs
        run: make pdocs
        working-directory: python

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          # Pinned to 10.21.0 — 10.22+ promotes ignored build scripts to a
          # fatal error under --frozen-lockfile in CI, which breaks the
          # docs install (esbuild postinstall). Until docs is moved to
          # workspace mode where onlyBuiltDependencies is honored, pin.
          version: 10.21.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: "pnpm"
          cache-dependency-path: "javascript/pnpm-lock.yaml"
      - name: Install javascript dependencies
        run: pnpm install --frozen-lockfile
        working-directory: javascript
      - name: Generate javascript docs
        run: pnpm run generate:api-reference
        working-directory: javascript

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: "pnpm"
          cache-dependency-path: "docs/pnpm-lock.yaml"
      - name: Install dependencies
        # pnpm 10.22+ treats ignored build scripts as a fatal error under
        # --frozen-lockfile in CI. esbuild needs its postinstall to unpack
        # its prebuilt binary. Writing the approval to a local .npmrc is
        # picked up reliably across pnpm versions; the env-var equivalent
        # has inconsistent array-value handling.
        run: |
          echo "only-built-dependencies[]=esbuild" >> .npmrc
          pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./docs/docs/dist"
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
