# Always-run workflow with internal path gating + aggregator. See #364.
#
# Why: branch protection on `main` requires specific checks to pass on
# every PR. A top-level `paths:` filter would make this workflow silently
# absent on unrelated PRs, leaving any required check stuck pending. So
# the workflow always runs; `changes` decides whether jobs do real work
# or skip; `python-complete` aggregates and reports one final status
# that branch protection requires.
name: python-ci

# All model traffic rides the LangWatch AI Gateway. One virtual key replaces
# every provider key: it is metered, capped, and revocable on its own, and no
# raw provider key sits in this repository's secrets for the examples job.
#
# The key lives in the OPENAI_API_KEY secret and is copied into whichever
# variable each client family reads. The base URLs below point those clients
# at the gateway: the openai SDK and litellm's openai lane read
# OPENAI_BASE_URL / OPENAI_API_BASE, and litellm's gemini lane reads
# GEMINI_API_BASE, set on the examples step.
#
# Operating notes:
#   - Rotate:   `langwatch virtual-keys rotate <id>` mints a new secret and
#               keeps the old one working for 24 hours. Put the new secret in
#               the OPENAI_API_KEY repository secret inside that window.
#   - Revoke:   `langwatch virtual-keys revoke <id>`. Allow up to a minute
#               before the old secret stops working everywhere: each gateway
#               pod caches a key's config for 60 seconds
#               (LW_GATEWAY_AUTH_CACHE_CONFIG_TTL_SECONDS). Restarting the
#               gateway deployment clears it at once.
#   - Cap:      the key carries its own spending budget, currently $15 per
#               day at virtual-key scope. On a hard breach the gateway
#               answers HTTP 402 `budget_exceeded` with the scope in
#               `error.meta.budget_scope`, and every test in this job fails
#               until the window resets. Size the cap well above a busy
#               day's spend: one full run costs about $0.09, and the
#               busiest day seen so far was 31 runs. `javascript-ci.yml` and
#               `javascript-voice-integration.yml` share this key and cost
#               far more per run, because they mint the OpenAI Realtime
#               session through the gateway, and the second mints the
#               ElevenLabs ConvAI session there too. `voice-integration.yml`,
#               the Python voice workflow, still dials both vendors directly
#               with OPENAI_REALTIME_API_KEY and ELEVENLABS_API_KEY, so its
#               voice traffic does not land on this budget. $4 was breached
#               mid-suite on 2026-08-21.
#   - Fall back: to call the providers directly again, clear the two base
#               URLs below and GEMINI_API_BASE on the examples step, and put
#               provider keys back in OPENAI_API_KEY and GEMINI_API_KEY.
env:
  CI: true
  OPENAI_BASE_URL: https://gateway.langwatch.ai/v1
  OPENAI_API_BASE: https://gateway.langwatch.ai/v1

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      # Whether this PR changes anything the examples suite covers. The gate
      # in front of that suite needs it to decide whether a gateway budget
      # outage is collateral or a genuine loss of coverage.
      examples: ${{ steps.detect.outputs.examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            relevant:
              - 'python/**'
              - '.github/workflows/python-ci.yml'
            examples:
              - 'python/examples/**'

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"] # Focus on primary version for performance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: python

      - name: Verify capability matrix is in sync with AdapterCapabilities
        run: |
          uv run python scripts/gen_capability_matrix.py
          git diff --exit-code ../docs/docs/pages/_generated/voice/capability-matrix.mdx \
            || (echo "Capability matrix is stale. Run 'python scripts/gen_capability_matrix.py' and commit the regen." && exit 1)
        working-directory: python

      - name: Run tests
        # `-m "not integration"` deselects voice e2e tests (auto-marked by
        # tests/voice/conftest.py). Those hit live providers and run on-demand
        # via voice-integration.yml.
        run: uv run pytest tests/ -v --tb=short -m "not integration"
        working-directory: python

      - name: Type check
        run: uv run pyright .
        working-directory: python

      # One definition of "this run can read repo secrets", so the live suite
      # below and its secret-free fallback cannot drift into both running or
      # neither. Dependabot PRs and fork PRs run without secrets.
      - name: Resolve secret availability
        id: secrets
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ] \
            || { [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; }; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # Examples: the live suite, for runs that can read repo secrets.
      - name: Test (Examples)
        if: steps.secrets.outputs.available == 'true'
        # Examples hit real LLMs over the network; they can legitimately take
        # well over the 60s per-test timeout that pytest.ini sets for the unit
        # suite. Override to 300s here so slow-but-correct runs don't get
        # pytest-timeout'd.
        # Wrapped so a shared-budget outage is told apart from a broken
        # example. The suite runs on one gateway virtual key with a daily
        # spend cap; when that cap is hit every test fails at once and blocks
        # unrelated PRs from merging. See scripts/ci/examples-suite-gate.sh
        # for what is tolerated and, more to the point, what is not.
        # --junitxml is what lets the gate decide per failed test rather than
        # by grepping the log: a budget outage and a genuinely broken example
        # can land in the same run, and only a per-test report separates them.
        run: ../scripts/ci/examples-suite-gate.sh uv run pytest examples/ -v --tb=short --timeout=300 --junitxml="$EXAMPLES_REPORT"
        env:
          EXAMPLES_TOUCHED: ${{ needs.changes.outputs.examples }}
          EXAMPLES_REPORT: ${{ runner.temp }}/examples-junit.xml
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The Gemini examples still call Google directly. The mechanism to
          # route them is ready and measured: litellm builds
          # `{GEMINI_API_BASE}/models/{model}:generateContent` and sends the
          # key as x-goog-api-key, so setting GEMINI_API_BASE to the
          # gateway's /v1beta surface and GEMINI_API_KEY to the same virtual
          # key moves them over with no change to any example. The whole
          # suite passes that way against a gateway that has a Google
          # credential.
          #
          # What is missing is the credential, and it takes two steps rather
          # than one. Add a Gemini provider to the LangWatch organization,
          # then add that provider to the routing policy this virtual key
          # is pinned to: a key with a policy reaches only the providers
          # listed in the policy's modelProviderIds, so an enabled provider
          # left off the list never joins the chain. Confirm with
          # `GET /v1/models` on the key, which lists what it can actually
          # dispatch to, before swapping in these two lines:
          #
          #   GEMINI_API_BASE: https://gateway.langwatch.ai/v1beta
          #   GEMINI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: python

      # The same examples, imported rather than run, for the runs the step
      # above cannot cover. Without this an examples-only change from an
      # external contributor reaches a green required check with nothing
      # having read the file it changed: `pytest tests/` never imports
      # `examples/`, and `pyright` sets `reportMissingImports: false`, so a
      # module that does not exist type-checks clean. Collection imports every
      # example module and makes no provider call, so it needs no secrets.
      - name: Collect (Examples)
        if: steps.secrets.outputs.available != 'true'
        run: uv run pytest examples/ --collect-only -q
        working-directory: python

  # One required check for the whole workflow. Reports success if every
  # upstream job either passed or was legitimately skipped (paths didn't
  # match). Reports failure if any upstream job failed.
  python-complete:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all needs succeeded or were legitimately skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
