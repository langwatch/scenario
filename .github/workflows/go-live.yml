name: go-live

# On-demand live suite of the Go SDK: the integration-tagged tests that talk
# to real providers (OpenAI, Anthropic, Gemini, Bedrock), a real LangWatch
# project and the real voice vendors (OpenAI Realtime, Gemini Live,
# ElevenLabs, Pipecat, Twilio). They cost real money, so the workflow only
# runs when started from the Actions tab or with `gh workflow run go-live`.
#
# Each test skips, naming the missing variable, when its secret is absent,
# and the summary of the run lists every skipped suite. Secrets read (any may
# be left unset):
#   - OPENAI_API_KEY         the LangWatch virtual key; with the gateway base
#                            URL below it pays for chat, STT, TTS and Realtime
#   - ANTHROPIC_API_KEY      providers/anthropic
#   - GEMINI_API_KEY         providers/gemini and Gemini Live
#   - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION   providers/bedrock
#   - LANGWATCH_API_KEY, LANGWATCH_ENDPOINT   round trip, traces, evaluators
#   - ELEVENLABS_API_KEY     ElevenLabs STT/TTS, and the hosted agent, which
#                            is provisioned below when ELEVENLABS_AGENT_ID is
#                            not a secret of its own
#   - TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER,
#     SCENARIO_TWILIO_EXTERNAL_TO   the PSTN call; also needs the `twilio`
#                            input, since it bills a real call
#   - NGROK_AUTHTOKEN        the ngrok tunnel smoke test

on:
  workflow_dispatch:
    inputs:
      modules:
        description: "Go modules to run, as paths under go/ (empty: all)"
        required: false
        default: ""
      run:
        description: "go test -run pattern"
        required: false
        default: "Live"
      pipecat:
        description: "Start the bundled Pipecat stub bot for the Pipecat tests"
        type: boolean
        default: true
      twilio:
        description: "Run the Twilio call test (bills a real PSTN call)"
        type: boolean
        default: false

env:
  CI: true
  OPENAI_BASE_URL: https://gateway.langwatch.ai/v1
  OPENAI_API_BASE: https://gateway.langwatch.ai/v1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
      LANGWATCH_ENDPOINT: ${{ secrets.LANGWATCH_ENDPOINT }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
      SCENARIO_TWILIO_EXTERNAL_TO: ${{ secrets.SCENARIO_TWILIO_EXTERNAL_TO }}
      SCENARIO_LIVE_TWILIO: ${{ inputs.twilio && '1' || '' }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      SCENARIO_LIVE_RUN: ${{ inputs.run }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/**/go.sum

      # Python only hosts the voice fixtures: the Pipecat stub bot and the
      # ElevenLabs agent provisioning script.
      - name: Set up Python 3.12
        if: ${{ inputs.pipecat || (env.ELEVENLABS_API_KEY != '' && env.ELEVENLABS_AGENT_ID == '') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python fixture dependencies
        if: ${{ inputs.pipecat || (env.ELEVENLABS_API_KEY != '' && env.ELEVENLABS_AGENT_ID == '') }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv sync --frozen
        working-directory: python

      - name: Start bundled Pipecat stub bot
        if: ${{ inputs.pipecat && env.OPENAI_API_KEY != '' }}
        run: |
          uv run python examples/voice/_bot/bot.py >> /tmp/voice-pipecat-bot.log 2>&1 &
          for i in $(seq 1 60); do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1', 8765), 0.5)" 2>/dev/null; then
              echo "PIPECAT_URL=ws://127.0.0.1:8765/stream" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.5
          done
          echo "::warning::Pipecat stub bot did not start; the Pipecat tests will skip"
          cat /tmp/voice-pipecat-bot.log || true
        working-directory: python

      - name: Provision ElevenLabs test agent
        if: ${{ env.ELEVENLABS_API_KEY != '' && env.ELEVENLABS_AGENT_ID == '' }}
        run: |
          AGENT_ID=$(uv run python ../scripts/provision_elevenlabs_agent.py)
          echo "::add-mask::${AGENT_ID}"
          echo "ELEVENLABS_AGENT_ID=${AGENT_ID}" >> "$GITHUB_ENV"
        working-directory: python

      - name: Install cloudflared
        if: ${{ inputs.twilio }}
        run: |
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Run the Go live suite
        # Inputs reach the shell through the environment, never inline, and
        # go straight to the script: `make go-live MODULES=...` would paste
        # them into the recipe as shell code.
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          read -ra modules <<< "$MODULES"
          go/scripts/live.sh "${modules[@]}"
